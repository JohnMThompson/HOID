[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hoid"
version = "0.1.0"
description = "A small, controlled Home Assistant client for HOID"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
stt = ["faster-whisper==1.2.1", "av==16.0.1"]

[project.scripts]
hoid = "hoid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
